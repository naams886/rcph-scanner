<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>1st RCPH 2026 SCANNER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root { --primary-purple: #3b0a4d; --accent-blue: #0dcaf0; }
        
        /* Hide original library dashboard elements */
        #reader__dashboard_section_csr, #reader__dashboard_section_swaplink { display: none !important; }

        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; overflow: hidden; position: fixed; width: 100%; padding: 15px; font-family: 'Segoe UI', sans-serif; }
        .main-container { max-width: 500px; margin: auto; }
        
        .dashboard-header { background: var(--primary-purple); color: white; padding: 12px 15px; border-radius: 15px; margin-bottom: 10px; }
        .scanner-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 5px solid white; }
        
        #profile-card { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 450px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 12px; text-align: center; z-index: 10000; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border-bottom: 6px solid #ddd; animation: slideDown 0.4s ease-out; }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 10px; opacity: 1; } }

        #reader__video { height: 300px !important; object-fit: cover; width: 100% !important; }
        #reader { width: 100% !important; border: none !important; }

        /* Button Styling */
        #extra-controls button {
            width: 40px !important; height: 38px !important;
            border-radius: 8px !important; border: none !important;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white;
        }

        #manualIdInput {
            flex: 2.5 !important; font-size: 1rem !important; padding: 0 12px !important;
            border: 2px solid var(--primary-purple) !important; border-radius: 8px !important; height: 38px !important;
        }
        
        .count-circle-container { display: flex; flex-direction: column; align-items: center; }
        .count-circle { background: white; color: var(--primary-purple); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        #last-person-container { margin-top: 5px; font-size: 0.7rem; background: rgba(255, 255, 255, 0.15); padding: 3px 10px; border-radius: 20px; display: none; }
    </style>
</head>
<body>
    <div id="profile-card">
        <div class="d-flex align-items-center justify-content-center">
            <span id="scan-icon" style="font-size: 20px; margin-right: 10px;">✅</span>
            <h5 id="p-name" class="fw-bold m-0" style="font-size: 0.95rem; color: #333;">NAME HERE</h5>
        </div>
        <div id="p-msg" class="small fw-bold opacity-75 mt-1" style="color: #555;">Ready...</div>
    </div>

    <div class="main-container">
        <div class="dashboard-header">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="fw-bold m-0" style="font-size: 1.1rem;">1st RCPH 2026</h4>
                <div style="font-size: 0.65rem; opacity: 0.6;">v3.3-Vibed</div>
            </div>

            <div class="d-flex justify-content-between align-items-end mt-1">
                <div>
                    <p class="small m-0 opacity-75" id="mode-text">Attendance Mode</p>
                    <div class="form-check form-switch mt-1">
                        <input class="form-check-input" type="checkbox" id="modeSwitch" onchange="updateModeText()" style="transform: scale(0.85); origin: left;">
                        <label class="form-check-label ms-1 fw-bold" for="modeSwitch" style="font-size: 0.75rem;">Verification Mode</label>
                    </div>
                </div>
                <div class="count-circle-container">
                    <div class="count-circle"><div id="total-count">?</div></div>
                    <div style="font-size: 0.55rem; margin-top: 2px; font-weight: bold;">PRESENT</div>
                </div>
            </div>
            
            <div id="last-person-container">👤 <span id="last-person-name">None</span></div>
        </div>

        <div class="scanner-card shadow-sm">
            <div id="control-row" style="padding: 8px; display: flex; gap: 5px; border-bottom: 1px solid #eee; background: #fdfdfd; align-items: center;">
                <input type="text" id="manualIdInput" placeholder="ID (R001)">
                <button onclick="triggerVibrate(); processManualEntry()" 
                        style="flex: 1.2; background: var(--primary-purple); color: white; border: none; height: 38px; border-radius: 8px; font-weight: bold; font-size: 0.75rem;">
                        Check-In
                </button>
                <div id="extra-controls" style="display: flex; gap: 5px;"></div>
            </div>
            <div id="reader"></div>
        </div>
    </div>

    <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz-wC1kWKox_lqtGexP09BX46GDu-86OiuOljOguuCjTwLIopC0tMN3SpTX2U5ivRbW/exec";
    let lastScannedId = "", lastScanTime = 0;
    const COOLDOWN_MS = 5000;

    function triggerVibrate() { if (navigator.vibrate) navigator.vibrate(40); }

    function updateModeText() {
        document.getElementById('mode-text').innerText = document.getElementById('modeSwitch').checked ? "Verification Mode" : "Attendance Mode";
    }

    window.onload = function() {
        if (prompt("Enter security PIN:") !== "umbi") { location.reload(); } else { syncCount(); }
    };

    function syncCount() {
        fetch(`${GOOGLE_URL}?mode=sync&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => { if (res.count !== undefined) document.getElementById('total-count').innerText = res.count; });
    }

    function showNotification(title, message, icon, color, autoHide = true) {
        const card = document.getElementById('profile-card');
        card.style.display = "block"; card.style.opacity = "1";
        card.style.borderBottom = `6px solid ${color}`;
        document.getElementById('scan-icon').innerText = icon;
        document.getElementById('p-name').innerText = title;
        document.getElementById('p-msg').innerText = message;
        if (autoHide) {
            setTimeout(() => {
                card.style.opacity = "0";
                setTimeout(() => { card.style.display = "none"; html5QrcodeScanner.resume(); }, 600);
            }, 3000);
        }
    }

    function onScanSuccess(decodedText) {
        const currentTime = Date.now();
        if (decodedText === lastScannedId && (currentTime - lastScanTime) < COOLDOWN_MS) return;
        triggerVibrate();
        lastScannedId = decodedText; lastScanTime = currentTime;
        html5QrcodeScanner.pause();
        showNotification("SENDING...", "Processing...", "⏳", "#3b0a4d", false);
        
        const mode = document.getElementById('modeSwitch').checked ? "verify" : "attendance";
        fetch(`${GOOGLE_URL}?qrContent=${encodeURIComponent(decodedText)}&mode=${mode}&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => {
                if (res.count !== undefined) document.getElementById('total-count').innerText = res.count;
                let color = res.status === "SUCCESS" ? "#28a745" : "#ffc107";
                showNotification(res.status, res.message, res.status === "SUCCESS" ? "✅" : "⚠️", color, true);
            });
    }

    function processManualEntry() {
        const input = document.getElementById('manualIdInput');
        if (input.value.trim()) { onScanSuccess(input.value.trim().toUpperCase()); input.value = ""; }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 30, qrbox: { width: 250, height: 250 }, showTorchButtonIfSupported: true 
    });
    html5QrcodeScanner.render(onScanSuccess);

    const observer = new MutationObserver(() => {
        const extraContainer = document.getElementById("extra-controls");
        const buttons = document.querySelectorAll("#reader button");
        
        buttons.forEach(btn => {
            const text = btn.innerText.toUpperCase();
            if (text.includes("STOP")) {
                btn.innerHTML = "✕"; btn.style.backgroundColor = "#dc3545";
                if (!btn.dataset.vibe) { btn.addEventListener('click', triggerVibrate); btn.dataset.vibe = "true"; }
                if (!extraContainer.contains(btn)) extraContainer.appendChild(btn);
            } 
            else if (text.includes("TORCH") || text.includes("FLASH")) {
                btn.innerHTML = "🔦"; btn.style.backgroundColor = "#ffc107"; btn.style.color = "#212529";
                if (!btn.dataset.vibe) { btn.addEventListener('click', triggerVibrate); btn.dataset.vibe = "true"; }
                if (!extraContainer.contains(btn)) extraContainer.appendChild(btn);
            }
            // Start/Resume buttons are ignored and left in the main reader area to keep top row clean
        });
    });
    observer.observe(document.getElementById("reader"), { childList: true, subtree: true });
    </script>
</body>
</html>

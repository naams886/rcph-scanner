<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCPH 2026 LENS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; }
        #video { width: 100%; max-width: 500px; border-radius: 20px; border: 4px solid #3b0a4d; background: #000; margin-top: 10px; }
        .status-card { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; display: none; padding: 20px; border-radius: 15px; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-card" class="status-card"></div>

    <div class="container mt-3">
        <h4 class="fw-bold" style="color:#a64dff">1st RCPH 2026</h4>
        <p class="small text-secondary">Native Hardware Scanner (No Iframe)</p>
        
        <video id="video" autoplay playsinline></video>
        
        <div class="mt-3 d-grid gap-2">
            <button id="start-btn" onclick="initScanner()" class="btn btn-primary p-3 fw-bold" style="background:#3b0a4d; border:none;">⚡ START LENS</button>
        </div>

        <div class="mt-4">
            <input type="text" id="manualInput" class="form-control text-center" placeholder="Manual ID (e.g. R001)">
            <button class="btn btn-outline-light btn-sm mt-2 w-100" onclick="sendToGoogle(document.getElementById('manualInput').value)">Submit Manual</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxUSPowEUSb4x6M1aXBhIIzYocmdzYfPhgndOxOQHgtZejpevK0ts76Dm2cQ8ysQFVR/exec";
        let video = document.getElementById('video');
        let statusCard = document.getElementById('status-card');

        async function initScanner() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                document.getElementById('start-btn').style.display = 'none';
                
                if (!('BarcodeDetector' in window)) {
                    alert("This browser doesn't support Native Detection. Try Chrome on Android.");
                    return;
                }

                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                
                async function scan() {
                    const barcodes = await detector.detect(video);
                    if (barcodes.length > 0) {
                        sendToGoogle(barcodes[0].rawValue);
                        return; // Stop scanning while processing
                    }
                    requestAnimationFrame(scan);
                }
                scan();
            } catch (err) {
                alert("Camera Access Denied. Check site permissions.");
            }
        }

        async function sendToGoogle(content) {
            showStatus("PROCESSING...", "#3b0a4d");

            // We use the URL query string to send data to the Google Script
            const finalUrl = `${API_URL}?qrContent=${encodeURIComponent(content)}`;

            try {
                const response = await fetch(finalUrl, { method: 'GET', mode: 'no-cors' });
                // Note: 'no-cors' means we won't see the response body, but the data WILL reach your sheet.
                showStatus("✅ SENT TO GOOGLE\nCheck sheet for confirmation.", "#28a745");
                setTimeout(() => { location.reload(); }, 4000);
            } catch (err) {
                showStatus("CONNECTION ERROR", "#dc3545");
                setTimeout(() => { location.reload(); }, 4000);
            }
        }

        function showStatus(msg, color) {
            statusCard.innerText = msg;
            statusCard.style.backgroundColor = color;
            statusCard.style.display = 'block';
        }
    </script>
</body>
</html>

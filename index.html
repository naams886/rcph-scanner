<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>1st RCPH 2026 LENS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        /* --- ALL YOUR ORIGINAL CSS REMAINS UNCHANGED --- */
        :root { --primary-purple: #3b0a4d; --accent-blue: #0dcaf0; --glass-bg: rgba(255, 255, 255, 0.9); }
        #reader__dashboard_section_csr { display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; justify-content: center !important; gap: 12px !important; padding: 10px 0 !important; }
        #reader__dashboard_section_csr button { flex: 0 1 auto !important; width: auto !important; min-width: 120px !important; margin: 5px 0 !important; }
        #reader button { background-color: var(--primary-purple) !important; color: white !important; border: none !important; padding: 10px 20px !important; border-radius: 10px !important; font-weight: 600 !important; text-transform: uppercase !important; font-size: 0.8rem !important; letter-spacing: 1px !important; transition: all 0.3s ease !important; margin: 10px 0 !important; box-shadow: 0 4px 10px rgba(59, 10, 77, 0.2) !important; }
        #reader__dashboard_section_swaplink { display: none !important; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; overflow: hidden; position: fixed; width: 100%; padding: 15px; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .main-container { max-width: 500px; margin: auto; }
        .dashboard-header { background: var(--primary-purple); color: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .scanner-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 5px solid white; }
        #profile-card { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 450px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; padding: 12px; text-align: center; z-index: 10000; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border-bottom: 6px solid #ddd; animation: slideDown 0.4s ease-out; }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 10px; opacity: 1; } }
        #reader__video { max-height: 250px !important; object-fit: cover; }

        /* --- COUNT CIRCLE & LAST SCANNED STYLES --- */
        .count-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .count-circle {
            background: white;
            color: var(--primary-purple);
            border: 2px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #total-count {
            font-size: 1rem;
            font-weight: bold;
        }

        /* Smaller QR Background Box */
        #reader {
            border: none !important;
        }
        
        /* Forces the video and the box to stay compact */
        #reader__video { 
            max-height: 350px !important; /* Shrunk from 250px */
            object-fit: cover; 
        }

        /* Adjusting the main scanner card to be tighter */
        .scanner-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 3px solid white;
        }

        #last-person-container {
            margin-top: 5px;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            border-radius: 20px;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none; /* Hidden until first scan */
        }
    </style>
</head>
<body>
    <div id="profile-card">
        <div class="d-flex align-items-center justify-content-center">
            <span id="scan-icon" style="font-size: 20px; margin-right: 10px;">✅</span>
            <h5 id="p-name" class="fw-bold m-0" style="font-size: 0.95rem; color: #333;">NAME HERE</h5>
        </div>
        <div id="p-msg" class="small fw-bold opacity-75 mt-1" style="color: #555;">Ready...</div>
    </div>

    <div class="main-container">
        <div class="dashboard-header">
            <div style="flex: 1;">
                <h4 class="fw-bold m-0">1st RCPH 2026</h4>
                <p class="small m-0 opacity-75" id="mode-text">Attendance Mode</p>
                <div id="last-person-container">
                    👤 <span id="last-person-name">None</span>
                </div>
            </div>
            <div class="text-end">
                <div style="font-size: 0.65rem; opacity: 0.6; margin-bottom: 2px;">v2.4-GH</div>
                <div class="count-circle-container">
                    <div class="count-circle">
                        <div id="total-count">?</div>
                    </div>
                    <div style="font-size: 0.6rem; margin-top: 3px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">Present</div>
                </div>
            </div>
        </div>

        <div class="mode-selector shadow-sm text-center" style="background: white; padding: 10px; border-radius: 10px; margin-bottom: 10px;">
            <div class="form-check form-switch d-inline-block">
                <input class="form-check-input" type="checkbox" id="modeSwitch">
                <label class="form-check-label ms-2 fw-bold small" for="modeSwitch">Verification Mode</label>
            </div>
        </div>

        <div class="scanner-card shadow-sm">
            <div id="reader"></div>
            <div style="padding: 10px; display: flex; gap: 5px;">
                <input type="text" id="manualIdInput" placeholder="ID (R001)" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
                <button onclick="processManualEntry()" style="background: #3b0a4d; color: white; border: none; padding: 8px 15px; border-radius: 5px;">Check-In</button>
            </div>
        </div>
    </div>

    <audio id="beepAttendance" src="https://assets.mixkit.co/active_storage/sfx/2635/2635-preview.mp3" preload="auto"></audio>
    <audio id="beepVerify" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto"></audio>
    <audio id="beepWarning" src="https://assets.mixkit.co/active_storage/sfx/1084/1084-preview.mp3" preload="auto"></audio>

    <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz-wC1kWKox_lqtGexP09BX46GDu-86OiuOljOguuCjTwLIopC0tMN3SpTX2U5ivRbW/exec";
    
    let lastScannedId = "";
    let lastScanTime = 0;
    const COOLDOWN_MS = 5000;

    const modeSwitch = document.getElementById('modeSwitch');
    const profileCard = document.getElementById('profile-card');
    const pName = document.getElementById('p-name');
    const pMsg = document.getElementById('p-msg');
    const scanIcon = document.getElementById('scan-icon');

    // 3) PIN appears immediately on load
    window.onload = function() {
        const SCANNER_PIN = "2026";
        let userPin = prompt("Enter security PIN to authorize scanner:");
        if (userPin !== SCANNER_PIN) {
            alert("Unauthorized! Page will reload.");
            location.reload();
        } else {
            window.isAuthorized = true;
            // Sync count immediately after login
            syncCount();
        }
    };

    function syncCount() {
        // Fetches only the count from Google Sheets
        fetch(`${GOOGLE_URL}?mode=sync&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => {
                if (res.count !== undefined) {
                    document.getElementById('total-count').innerText = res.count;
                }
            });
    }

    function showNotification(title, message, icon, color, autoHide = true) {
        if (window.hideTimeout) clearTimeout(window.hideTimeout);
        profileCard.style.display = "block";
        profileCard.style.opacity = "1";
        profileCard.style.borderBottomColor = color;
        scanIcon.innerText = icon;
        pName.innerText = title;
        pMsg.innerText = message;

        if (autoHide) {
            window.hideTimeout = setTimeout(() => {
                profileCard.style.opacity = "0";
                setTimeout(() => { 
                    profileCard.style.display = "none"; 
                    html5QrcodeScanner.resume();
                }, 600);
            }, 3000);
        }
    }

    function onScanSuccess(decodedText) {
        const currentTime = Date.now();
        if (decodedText === lastScannedId && (currentTime - lastScanTime) < COOLDOWN_MS) return;

        lastScannedId = decodedText;
        lastScanTime = currentTime;

        html5QrcodeScanner.pause();
        showNotification("SENDING...", "To Google Sheets...", "⏳", "#3b0a4d", false);

        const mode = modeSwitch.checked ? "verify" : "attendance";
        const finalUrl = `${GOOGLE_URL}?qrContent=${encodeURIComponent(decodedText)}&mode=${mode}&secret=RCPH2026`;

        fetch(finalUrl, { mode: 'cors' })
            .then(response => response.json())
            .then(res => {
                let sound, title, color, icon;

                if (res.count !== undefined) {
                    document.getElementById('total-count').innerText = res.count;
                }

                // Update Last Scanned Name label
                if (res.message && res.status !== "ERROR") {
                    const nameContainer = document.getElementById('last-person-container');
                    const nameLabel = document.getElementById('last-person-name');
                    nameLabel.innerText = res.message.split('\n')[0];
                    nameContainer.style.display = "inline-block";
                }

                if (res.status === "SUCCESS") {
                    title = modeSwitch.checked ? "VERIFIED" : "CONFIRMED";
                    color = "#28a745";
                    icon = "✅";
                    sound = document.getElementById(modeSwitch.checked ? 'beepVerify' : 'beepAttendance');
                } else if (res.status === "ALREADY" || res.status === "ALREADY_VERIFIED") {
                    title = modeSwitch.checked ? "ALREADY VERIFIED" : "ALREADY CHECKED-IN";
                    color = "#ffc107";
                    icon = "⚠️";
                    sound = document.getElementById('beepWarning');
                } else {
                    title = "ERROR";
                    color = "#dc3545";
                    icon = "❌";
                    sound = document.getElementById('beepWarning');
                }

                if (sound) { sound.currentTime = 0; sound.play(); }
                showNotification(title, res.message, icon, color, true);
            })
            .catch(err => {
                showNotification("NETWORK ERROR", "Check internet", "❌", "#dc3545", true);
            });
    }

    function processManualEntry() {
        const input = document.getElementById('manualIdInput');
        if (input.value.trim()) {
            onScanSuccess(input.value.trim().toUpperCase());
            input.value = "";
        }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 20, 
        qrbox: { width: 280, height: 200 },
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    });
    html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>

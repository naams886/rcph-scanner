<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>1st RCPH 2026 SCANNER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root { --primary-purple: #3b0a4d; --accent-yellow: #ffc107; --danger-red: #dc3545; --success-green: #28a745; }
        #reader img[alt="Info icon"] { display: none !important; }

        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; overflow: hidden; position: fixed; width: 100%; padding: 15px; font-family: 'Segoe UI', sans-serif; }
        .main-container { max-width: 500px; margin: auto; }
        
        .dashboard-header { background: var(--primary-purple); color: white; padding: 12px 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .scanner-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid white; }
        
        /* v7.3: The Transparent Floating Glass Window */
        #profile-card { 
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 440px; 
            background: rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(15px) saturate(180%) !important; 
            -webkit-backdrop-filter: blur(15px) saturate(180%) !important;
            border-radius: 22px; padding: 20px; text-align: center; z-index: 10000; 
            display: none; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-top: 8px solid transparent !important; /* Contextual color bar */
        }

        #reader__video { height: 360px !important; object-fit: cover; width: 100% !important; border-radius: 12px; }
        #reader { width: 100% !important; border: none !important; }

        /* v7.3: Strict CSS to kill button text */
        #reader button { 
            font-size: 0px !important; /* Hide original text */
            color: transparent !important;
            background-color: var(--primary-purple) !important; 
            border: none !important; border-radius: 12px !important; 
            margin: 15px auto !important; 
        }

        #control-row { padding: 8px 12px; display: flex; gap: 8px; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
        #manualIdInput { flex-grow: 1; min-width: 0; height: 38px; border: 2px solid #e0e0e0; border-radius: 10px; padding: 0 12px; font-size: 0.85rem; outline: none; }
        #btn-checkin { background: var(--primary-purple); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.8rem; padding: 0 15px; height: 38px; white-space: nowrap; }

        #extra-controls { display: flex; gap: 6px; }
        #extra-controls button { width: 38px !important; height: 38px !important; border-radius: 50% !important; border: none !important; display: flex; align-items: center; justify-content: center; font-size: 1.2rem !important; }

        .count-circle { background: white; color: var(--primary-purple); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <audio id="beepSuccess" src="https://assets.mixkit.co/active_storage/sfx/2635/2635-preview.mp3" preload="auto"></audio>
    <audio id="beepWarning" src="https://assets.mixkit.co/active_storage/sfx/1084/1084-preview.mp3" preload="auto"></audio>

    <div id="profile-card">
        <div class="d-flex align-items-center justify-content-center mb-1">
            <span id="scan-icon" style="font-size: 24px; margin-right: 10px;"></span>
            <h5 id="p-name" class="fw-bold m-0" style="font-size: 1.15rem; color: #000;"></h5>
        </div>
        <div id="p-msg" class="mt-2 fw-bold" style="color: #111; font-size: 0.95rem;"></div>
    </div>

    <div class="main-container">
        <div class="dashboard-header">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <h4 class="fw-bold m-0" style="font-size: 1.05rem;">1st RCPH 2026</h4>
                    <span class="badge bg-light text-dark" style="font-size: 0.55rem; opacity: 0.9;">v7.3</span>
                </div>
                <div class="count-circle" id="total-count">?</div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="modeSwitch" onchange="updateModeText()">
                    <label class="form-check-label text-white small fw-bold" id="mode-text" style="font-size: 0.75rem;">Attendance Mode</label>
                </div>
                <div id="last-person-container" class="small text-end" style="font-size: 0.7rem; flex: 1; margin-left: 10px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
                    👤 <span id="last-person-name">Ready</span>
                </div>
            </div>
        </div>

        <div class="scanner-card">
            <div id="control-row">
                <input type="text" id="manualIdInput" placeholder="Tap to Enter ID..." autocomplete="off">
                <button id="btn-checkin" onclick="handleManual()">Check-In</button>
                <div id="extra-controls"></div>
            </div>
            <div id="reader"></div>
        </div>
    </div>

    <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz-wC1kWKox_lqtGexP09BX46GDu-86OiuOljOguuCjTwLIopC0tMN3SpTX2U5ivRbW/exec";
    
    function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
    function playSound(id) { document.getElementById(id).play().catch(()=>{}); }

    function syncCount() {
        fetch(`${GOOGLE_URL}?mode=sync&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => { if (res.count !== undefined) document.getElementById('total-count').innerText = res.count; });
    }

    window.onload = function() {
        const pin = prompt("Security PIN:");
        if (pin !== "umbi") { location.reload(); } else { syncCount(); }
    };

    function updateModeText() {
        vibrate();
        const isVerify = document.getElementById('modeSwitch').checked;
        document.getElementById('mode-text').innerText = isVerify ? "Verification Mode" : "Attendance Mode";
        document.getElementById('btn-checkin').innerText = isVerify ? "Verify" : "Check-In";
    }

    function showNotification(title, message, icon, color, status) {
        const card = document.getElementById('profile-card');
        
        // Clean underscores and standardize labels
        let displayTitle = title.split('_').join(' '); 
        if (displayTitle === "ALREADY") displayTitle = "ALREADY CHECKED-IN";
        if (displayTitle === "SUCCESS") displayTitle = "VERIFIED";

        let cleanName = message.split('\n')[0].replace(/✅|⚠️|❌|SUCCESS:|VERIFIED:|ALREADY CHECKED IN:|ALREADY VERIFIED:|CONFIRMED:|ERROR:|PUAN \| MRS\. |TUAN \| MR\. /gi, '').trim();

        document.getElementById('scan-icon').innerText = icon;
        document.getElementById('p-name').innerText = displayTitle;
        document.getElementById('p-msg').innerText = cleanName;
        
        // Contextual Top-Bar colors
        if (status === "SUCCESS") {
            document.getElementById('p-name').style.color = "var(--success-green)";
            card.style.borderTopColor = "var(--success-green)";
        } else if (status.includes("ALREADY")) {
            document.getElementById('p-name').style.color = "#856404";
            card.style.borderTopColor = "var(--accent-yellow)";
        } else {
            document.getElementById('p-name').style.color = "var(--danger-red)";
            card.style.borderTopColor = "var(--danger-red)";
        }

        card.style.display = "block";
        if(status === "SUCCESS") playSound('beepSuccess'); else playSound('beepWarning');

        setTimeout(() => { 
            card.style.display = "none"; 
            if (html5QrcodeScanner.getState() === 3) html5QrcodeScanner.resume();
        }, 3000);
    }

    function onScanSuccess(decodedText) {
        vibrate();
        html5QrcodeScanner.pause();
        const mode = document.getElementById('modeSwitch').checked ? "verify" : "attendance";
        fetch(`${GOOGLE_URL}?qrContent=${encodeURIComponent(decodedText)}&mode=${mode}&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => {
                if (res.count !== undefined) document.getElementById('total-count').innerText = res.count;
                const cleanHeaderName = res.message.split('\n')[0].replace(/✅|⚠️|❌|SUCCESS:|VERIFIED:|ALREADY CHECKED IN:|ALREADY VERIFIED:|CONFIRMED:|ERROR:|PUAN \| MRS\. |TUAN \| MR\. /gi, '').trim();
                document.getElementById('last-person-name').innerText = cleanHeaderName;
                
                let icon = "✅"; let color = "var(--success-green)";
                if (res.status.includes("ALREADY")) icon = "⚠️";
                else if (res.status === "ERROR") icon = "❌";

                showNotification(res.status, res.message, icon, color, res.status);
            });
    }

    function handleManual() {
        vibrate();
        const input = document.getElementById('manualIdInput');
        if (input.value.trim()) { onScanSuccess(input.value.trim().toUpperCase()); input.value = ""; }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 25, qrbox: { width: 300, height: 300 },
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true 
    });
    html5QrcodeScanner.render(onScanSuccess);

    // v7.3: Aggressive Button Text Management
    setInterval(() => {
        const extraContainer = document.getElementById("extra-controls");
        const libButtons = document.querySelectorAll("#reader button");
        libButtons.forEach(btn => {
            const txt = btn.innerText.toUpperCase();
            
            // Check for Stop Scanning Button
            if (txt.includes("STOP") || txt.includes("SCANNING")) {
                btn.innerText = ""; // Clear text node
                btn.innerHTML = "📸"; // Insert emoji
                btn.style.fontSize = "1.2rem";
                btn.style.backgroundColor = "#dc3545";
                if (btn.parentElement !== extraContainer) extraContainer.appendChild(btn);
            } 
            // Check for Torch/Flash Button
            if (txt.includes("TORCH") || txt.includes("FLASH") || txt.includes("ON") || txt.includes("OFF")) {
                btn.innerText = ""; // Clear text node
                btn.innerHTML = "🔦"; // Insert emoji
                btn.style.fontSize = "1.2rem";
                btn.style.backgroundColor = "var(--accent-yellow)"; btn.style.color = "#000";
                if (btn.parentElement !== extraContainer) extraContainer.appendChild(btn);
            }
        });
    }, 100); 
    </script>
</body>
</html>

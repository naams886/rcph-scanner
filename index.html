<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>1st RCPH 2026 SCANNER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root { --primary-purple: #3b0a4d; }
        #reader img[alt="Info icon"] { display: none !important; }

        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; overflow: hidden; position: fixed; width: 100%; padding: 15px; font-family: 'Segoe UI', sans-serif; }
        .main-container { max-width: 500px; margin: auto; }
        
        .dashboard-header { background: var(--primary-purple); color: white; padding: 12px 15px; border-radius: 15px; margin-bottom: 10px; }
        .scanner-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 5px solid white; }
        
        /* Glassmorphism Profile Card */
        #profile-card { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            width: 95%; max-width: 450px; 
            background: rgba(255, 255, 255, 0.85); /* Semi-transparent */
            backdrop-filter: blur(10px); /* Frosted effect */
            border-radius: 15px; padding: 15px; text-align: center; z-index: 10000; 
            display: none; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
            border: 1px solid rgba(255,255,255,0.3);
        }

        #reader__video { height: 320px !important; object-fit: cover; width: 100% !important; border-radius: 10px; }
        #reader { width: 100% !important; border: none !important; min-height: 250px; }

        /* Extra Controls Positioning */
        #extra-controls { display: flex; gap: 8px; margin-left: auto; }
        #extra-controls button {
            width: 42px !important; height: 38px !important;
            padding: 0 !important; border-radius: 8px !important;
            border: none !important; font-size: 1.1rem !important;
            color: white !important;
            display: flex; align-items: center; justify-content: center;
        }

        #reader button {
            background-color: var(--primary-purple) !important;
            color: white !important;
            border: none !important;
            padding: 12px 24px !important;
            border-radius: 10px !important;
            font-weight: bold !important;
            margin: 10px auto !important;
            display: block !important;
        }

        #manualIdInput {
            flex: 2 !important; height: 38px !important;
            border: 2px solid var(--primary-purple) !important;
            border-radius: 8px !important; padding: 0 10px !important;
        }

        .count-circle { background: white; color: var(--primary-purple); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-active-effect:active { opacity: 0.7; transform: scale(0.95); transition: 0.1s; }
    </style>
</head>
<body>
    <audio id="beepSuccess" src="https://assets.mixkit.co/active_storage/sfx/2635/2635-preview.mp3" preload="auto"></audio>
    <audio id="beepWarning" src="https://assets.mixkit.co/active_storage/sfx/1084/1084-preview.mp3" preload="auto"></audio>

    <div id="profile-card">
        <div class="d-flex align-items-center justify-content-center">
            <span id="scan-icon" style="font-size: 20px; margin-right: 10px;">✅</span>
            <h5 id="p-name" class="fw-bold m-0" style="letter-spacing: -0.5px;">NAME HERE</h5>
        </div>
        <div id="p-msg" class="small mt-1" style="color: #444;">Ready...</div>
    </div>

    <div class="main-container">
        <div class="dashboard-header">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <h4 class="fw-bold m-0" style="font-size: 1.1rem;">1st RCPH 2026</h4>
                    <span class="badge bg-light text-dark" style="font-size: 0.6rem; opacity: 0.8;">v5.6</span>
                </div>
                <div class="count-circle" id="total-count">?</div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="modeSwitch" onchange="updateModeText()">
                    <label class="form-check-label text-white small fw-bold" id="mode-text">Attendance Mode</label>
                </div>
                <div id="last-person-container" class="small text-end" style="font-size: 0.75rem; flex: 1; margin-left: 10px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    👤 <span id="last-person-name">Ready</span>
                </div>
            </div>
        </div>

        <div class="scanner-card shadow-sm">
            <div id="control-row" style="padding: 8px; display: flex; gap: 5px; align-items: center; background: #fdfdfd; border-bottom: 1px solid #eee;">
                <input type="text" id="manualIdInput" placeholder="ID (R001)">
                <button onclick="handleManual()" class="btn-active-effect" style="flex: 1; background: var(--primary-purple); color: white; border: none; height: 38px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; margin: 0 !important;">Check-In</button>
                <div id="extra-controls"></div>
            </div>
            <div id="reader"></div>
        </div>
    </div>

    <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz-wC1kWKox_lqtGexP09BX46GDu-86OiuOljOguuCjTwLIopC0tMN3SpTX2U5ivRbW/exec";
    
    function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
    function playSound(id) { document.getElementById(id).play().catch(()=>{}); }

    window.onload = function() {
        const pin = prompt("Enter security PIN:");
        if (pin !== "umbi") { location.reload(); } else { syncCount(); }
    };

    function syncCount() {
        fetch(`${GOOGLE_URL}?mode=sync&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => { if (res.count !== undefined) document.getElementById('total-count').innerText = res.count; });
    }

    function updateModeText() {
        vibrate();
        document.getElementById('mode-text').innerText = document.getElementById('modeSwitch').checked ? "Verification Mode" : "Attendance Mode";
    }

    // Helper to shorten names
    function shortenName(name) {
        let clean = name.replace(/PUAN \| MRS\. |TUAN \| MR\. /g, '').trim();
        let parts = clean.split(' ');
        if (parts.length > 2) return `${parts[0]} ${parts[1]} ${parts[2][0]}.`;
        return clean;
    }

    function showNotification(title, message, icon, color, status) {
        const card = document.getElementById('profile-card');
        card.style.display = "block";
        card.style.borderBottom = `6px solid ${color}`;
        document.getElementById('scan-icon').innerText = icon;
        
        const isVerification = document.getElementById('modeSwitch').checked;
        let displayTitle = title;
        
        // Fix for #1: Removing underscore
        if (status === "ALREADY_SCANNED") {
            displayTitle = isVerification ? "ALREADY VERIFIED" : "ALREADY CHECKED-IN";
        }

        document.getElementById('p-name').innerText = displayTitle;
        document.getElementById('p-msg').innerText = message;
        
        if(status === "SUCCESS") playSound('beepSuccess'); else playSound('beepWarning');

        setTimeout(() => { 
            card.style.display = "none"; 
            if (html5QrcodeScanner.getState() === 3) html5QrcodeScanner.resume(); 
        }, 3000);
    }

    function onScanSuccess(decodedText) {
        vibrate();
        html5QrcodeScanner.pause();
        const mode = document.getElementById('modeSwitch').checked ? "verify" : "attendance";
        fetch(`${GOOGLE_URL}?qrContent=${encodeURIComponent(decodedText)}&mode=${mode}&secret=RCPH2026`)
            .then(res => res.json())
            .then(res => {
                if (res.count !== undefined) document.getElementById('total-count').innerText = res.count;
                const nameStr = res.message.split('\n')[0];
                document.getElementById('last-person-name').innerText = shortenName(nameStr);
                showNotification(res.status, res.message, res.status === "SUCCESS" ? "✅" : "⚠️", res.status === "SUCCESS" ? "#28a745" : "#ffc107", res.status);
            });
    }

    function handleManual() {
        vibrate();
        const input = document.getElementById('manualIdInput');
        if (input.value.trim()) { onScanSuccess(input.value.trim().toUpperCase()); input.value = ""; }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 25, 
        qrbox: { width: 280, height: 280 },
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    });
    html5QrcodeScanner.render(onScanSuccess);

    // MutationObserver to catch library-generated buttons
    const observer = new MutationObserver(() => {
        const extraContainer = document.getElementById("extra-controls");
        const buttons = document.querySelectorAll("#reader button");
        
        buttons.forEach(btn => {
            const text = btn.innerText.toUpperCase();
            if (!btn.hasAttribute('data-vibrate-set')) {
                btn.addEventListener('click', vibrate);
                btn.setAttribute('data-vibrate-set', 'true');
            }
            btn.classList.add('btn-active-effect');

            // Move Stop Button
            if (text.includes("STOP")) {
                btn.innerHTML = "📷ᳵ";
                btn.style.backgroundColor = "#dc3545";
                if (btn.parentElement !== extraContainer) extraContainer.appendChild(btn);
            } 
            // Move/Create Torch Button
            else if (text.includes("TORCH") || text.includes("FLASH")) {
                btn.innerHTML = "🔦";
                btn.style.backgroundColor = "#ffc107";
                btn.style.color = "#212529";
                if (btn.parentElement !== extraContainer) extraContainer.appendChild(btn);
            }
        });
    });
    observer.observe(document.getElementById("reader"), { childList: true, subtree: true });
    </script>
</body>
</html>
